<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5048e5" />
    <meta name="description" content="Derechos reservados por Gabriel Gonzalez" />
    <meta name="author" content="Gabriel Gonzalez" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235048e5'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
    <title>Matemática · aprende paso a paso</title>
    <style>
      /* Pantalla de carga sin JavaScript: si la app no llega a arrancar (p. ej., al abrir
         este archivo directamente en el navegador), a los pocos segundos explica qué hacer. */
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; font-family: system-ui, 'Segoe UI', sans-serif; color: #565d71; background: #f5f6fb; }
      .boot-mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff; font: 2rem Georgia, serif; background: linear-gradient(135deg, #5048e5, #a55cf0); }
      .boot p { margin: 0; max-width: 460px; }
      .boot-help { opacity: 0; animation: boot-help 0.3s 5s forwards; font-size: 0.9rem; line-height: 1.5; }
      .boot code { background: #e6e9f4; padding: 1px 6px; border-radius: 6px; }
      @keyframes boot-help { to { opacity: 1; } }
      @media (prefers-color-scheme: dark) { .boot { background: #0e1016; color: #a6acbd; } .boot code { background: #262b3a; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">∑</div>
        <p>Cargando…</p>
        <p class="boot-help">
          Si esta pantalla no cambia: este archivo no se puede abrir directamente en el navegador.
          Abre la aplicación de escritorio <b>Matemática</b> o, para desarrollar, ejecuta <code>npm run dev</code> y entra en <code>http://localhost:5173</code>.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
