// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Las carpetas de compilación van fuera del proyecto (está en OneDrive): la sincronización
// bloquea los archivos intermedios y Gradle no puede borrarlos entre compilaciones.
def localAppData = System.getenv('LOCALAPPDATA')
if (localAppData) {
    def outRoot = new File(localAppData, 'matematica-build/android')
    allprojects {
        layout.buildDirectory.set(new File(outRoot, project == rootProject ? 'root' : project.name))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
